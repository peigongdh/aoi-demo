<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AOI Demo</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="connection">
          <label class="field">
            <span>Server</span>
            <input id="server-url" type="text" spellcheck="false" />
          </label>
          <button id="connect" type="button">Connect</button>
          <button id="disconnect" type="button">Disconnect</button>
        </div>
        <div class="aoi-switch">
          <label class="field compact">
            <span>AOI</span>
            <select id="aoi-type">
              <option value="bruteforce">bruteforce</option>
              <option value="grid">grid</option>
              <option value="tower">tower</option>
            </select>
          </label>
          <button id="apply-aoi" type="button">Apply</button>
        </div>
        <div class="toggles">
          <label><input id="debug-mode" type="checkbox" checked /> Debug</label>
          <label><input id="show-grid" type="checkbox" checked /> Grid</label>
          <label><input id="show-aoi" type="checkbox" checked /> AOI</label>
          <label><input id="show-all" type="checkbox" checked /> All</label>
        </div>
        <div class="status-line">
          <span id="status-dot" class="status-dot"></span>
          <span id="connection-status">Disconnected</span>
        </div>
      </header>

      <main class="layout">
        <section class="world-panel">
          <canvas id="world-canvas"></canvas>
        </section>

        <aside class="side-panel">
          <section class="panel-block">
            <h2>World</h2>
            <dl id="world-stats"></dl>
          </section>
          <section class="panel-block">
            <h2>Player</h2>
            <dl id="player-stats"></dl>
          </section>
          <section class="panel-block event-block">
            <h2>AOI Events</h2>
            <ol id="event-log"></ol>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
